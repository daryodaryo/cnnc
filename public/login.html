<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — cnnc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html">cn<b>nc</b></a>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Home</a>
    </nav>
  </div>
</header>

<main>
  <section class="auth">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="sub">Enter your details to continue.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="[email protected]" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button class="btn gold" type="submit" id="submit-btn">Log in</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>

<script>
  const form = document.getElementById('login-form');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.className = 'status';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Checking…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (data.ok) {
        statusEl.textContent = 'Logged in successfully.';
        statusEl.className = 'status ok';
      } else {
        statusEl.textContent = data.message || 'Invalid email or password.';
        statusEl.className = 'status err';
      }
    } catch (err) {
      statusEl.textContent = 'Something went wrong. Please try again.';
      statusEl.className = 'status err';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>

</body>
</html>
